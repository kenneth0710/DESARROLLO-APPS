<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Calculadora</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Calculadora</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-input id="num1" label="Num1" type="number" [(ngModel)]="num1"></ion-input>
  </ion-item>

  <ion-item>
    <ion-select id="op" label="Op." interface="popover" [(ngModel)]="operador">
      <ion-select-option *ngFor="let o of operadores" [value]="o.simbolo">{{ o.simbolo }}</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item>
    <ion-input id="num2" label="Num2" type="number" [(ngModel)]="num2"></ion-input>
  </ion-item>

  <ion-button expand="block" (click)="operar()">Operar</ion-button>

  <ion-text color="danger" *ngIf="error">
    <p>{{ error }}</p>
  </ion-text>

  <p>Resultado = {{ resultado !== null ? resultado : '' }}</p>

  <ion-list>
    <ion-list-header>
      <ion-label><h2>Historial</h2></ion-label>
    </ion-list-header>
    <ion-item *ngFor="let op of historial">
      <ion-label>{{ op.texto }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
